version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: learn-spring-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306" # Expose MySQL port
    volumes:
      - mysql_data:/var/lib/mysql # Persistent storage for MySQL data
      - ./docker/mysql/init:/docker-entrypoint-initdb.d # Initialization scripts
    networks:
      - spring-network # Connect to the custom network
    healthcheck: # Health check for MySQL
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"] # Check if MySQL is responsive
      timeout: 20s # Timeout for the health check
      retries: 10 # Number of retries before marking the service as unhealthy

  # Redis Cache (for future implementation)
  redis:
    image: redis:7-alpine
    container_name: learn-spring-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - spring-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Zipkin for distributed tracing
  zipkin:
    image: openzipkin/zipkin
    container_name: learn-spring-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - spring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9411/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: learn-spring-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - spring-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: learn-spring-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - spring-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_datalog:
    driver: local
  kafka_data:
    driver: local

networks:
  spring-network:
    driver: bridge